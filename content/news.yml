    title: The 2nd Seoul Urban AI Forum (Smart Life Week, Seoul)
    body: Prof. Sung Hoo Kim was invited to speak at the 2nd Seoul Urban AI Forum,
      hosted by the Seoul Metropolitan Government and organized by the Seoul AI
      Foundation as part of Smart Life Week 2026. He presented recent research
      on integrating mobile network, travel survey, and geospatial data using AI
      to infer travel modes and improve origin–destination (O/D) estimation.
      Following the session, he participated in a panel discussion alongside Dr.
      Agnieszka Iwasiewicz-Wabnig (Univ. of Cambridge), Prof. Bilal Farooq
      (Toronto Metropolitan University), Prof. Xiaopeng Li (Univ. of
      Wisconsin–Madison), Prof. Jaekyoung Kim (Univ. of Seoul), Dr. Umberto
      Fugiglando (MIT Senseable City Lab), and Prof. Thomas Schroepfer
      (Singapore University of Technology and Design).
