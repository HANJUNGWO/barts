    title: Smart Mobility session, ACE Congress 2026 @Korea Univ.
    body: "The BARTS Lab organized a session at the 2026 Future-Shaping ACE
      Congress, hosted by the School of Architectural, Civil, and Environmental
      (ACE) Engineering at Korea University (Oct 26, 2026). We welcomed
      distinguished speakers who shared their latest research on emerging topics
      in transportation and mobility: Prof. Sylvia He (The Chinese University of
      Hong Kong), Prof. Prateek Bansal (National University of Singapore), Prof.
      Baichuan Mo (Tsinghua University), Prof. Yuki Oyama (The University of
      Tokyo), and Prof. Yunhan Zheng (Peking University). We also enjoyed
      engaging discussions with the speakers."
