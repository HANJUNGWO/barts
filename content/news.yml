    title: Visiting Professor Giancarlos Parady at the BARTS Lab
    body: Prof. Sung Hoo Kim hosted Prof. Giancarlos Parady of the University of
      Tokyo as a visiting professor from July to September 2026. During his
      3-month stay at the BARTS Lab, we learned a great deal from him, explored
      opportunities for future collaboration, and created many wonderful
      memories together. Thank you for your time with us, and we hope to welcome
      you back again soon!
