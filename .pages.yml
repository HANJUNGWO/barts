# Pages CMS 관리자 화면 설정 (app.pagescms.org)
# 이 파일은 관리자 화면의 "입력 칸"을 정의합니다. 보통은 고칠 필요가 없습니다.

media:
  input: images
  output: images
  categories: [image]

content:
  # ------------------------------------------------------------ 소식
  - name: news
    label: "📰 소식 · 갤러리"
    description: "맨 위가 최신 소식입니다. 사진을 넣으면 갤러리에도 자동으로 올라갑니다. 항목 왼쪽 손잡이를 끌어 순서를 바꿀 수 있습니다."
    type: file
    path: content/news.yml
    format: yaml
    list:
      collapsible:
        collapsed: true
        summary: "{fields.date} · {fields.title}"
    fields:
      - name: year
        label: "연도 (묶음용)"
        type: number
        required: true
      - name: date
        label: "날짜"
        description: "자유 형식. 예) 2026-10-29 / 2026-10-19 ~ 23 / 2026"
        type: string
        required: true
      - name: tag
        label: "분류"
        type: select
        options:
          values:
            - { value: award, label: "수상" }
            - { value: conference, label: "학회" }
            - { value: talk, label: "발표·초청강연" }
            - { value: seminar, label: "세미나" }
            - { value: service, label: "학술활동 (편집위원 등)" }
            - { value: grant, label: "연구과제" }
            - { value: people, label: "연구실 (방문, 생일 등)" }
            - { value: event, label: "행사" }
      - name: title
        label: "제목"
        type: string
        required: true
      - name: body
        label: "설명 (선택)"
        type: text
      - name: photos
        label: "사진 (여러 장 가능)"
        description: "여러 장을 한 번에 올릴 수 있습니다. 첫 번째 사진이 목록·갤러리의 대표 사진이 되고, 소식을 누르면 모든 사진이 보입니다."
        type: image
        options:
          multiple: true
      - name: image_url
        label: "외부 사진 주소 (기존 구글 사이트 사진)"
        description: "옛 구글 사이트 사진 주소입니다. 위 '사진'에 새로 올렸다면 이 칸은 지워도 됩니다."
        type: string
      - name: link
        label: "관련 링크 (선택)"
        type: string

  # ------------------------------------------------------------ 논문
  - name: publications
    label: "📄 논문"
    description: "새 논문은 목록 맨 위에 추가하세요. 'Sung Hoo Kim' 이름은 자동으로 굵게 표시됩니다. 교신저자는 이름 뒤에 * 표시."
    type: file
    path: content/publications.yml
    format: yaml
    fields:
      - name: journal
        label: "저널 논문"
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.year} · {fields.title}"
        fields:
          - name: year
            label: "연도"
            type: number
            required: true
          - name: authors
            label: "저자"
            description: "예) Kim, Sung Hoo*; Gildong Hong; Patricia Mokhtarian"
            type: string
            required: true
          - name: title
            label: "제목"
            type: string
            required: true
          - name: venue
            label: "저널 / 출처"
            type: string
            required: true
          - name: link
            label: "DOI 링크 (선택)"
            description: "예) https://doi.org/10.1016/..."
            type: string
      - name: chapters
        label: "북챕터"
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.year} · {fields.title}"
        fields:
          - name: year
            label: "연도"
            type: number
            required: true
          - name: authors
            label: "저자"
            description: "예) Kim, Sung Hoo*; Gildong Hong; Patricia Mokhtarian"
            type: string
            required: true
          - name: title
            label: "제목"
            type: string
            required: true
          - name: venue
            label: "저널 / 출처"
            type: string
            required: true
          - name: link
            label: "DOI 링크 (선택)"
            description: "예) https://doi.org/10.1016/..."
            type: string

  # ------------------------------------------------------------ 구성원
  - name: people
    label: "👥 구성원"
    type: file
    path: content/people.yml
    format: yaml
    fields:
      - name: members
        label: "연구원 (재학생·포닥)"
        description: "'과정'을 고르면 홈페이지에서 자동으로 그룹이 나뉩니다. 같은 그룹 안에서는 적은 순서대로 표시됩니다."
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.role} · {fields.name.ko}"
        fields:
          - name: name
            label: "이름"
            type: object
            fields:
              - { name: ko, label: "한글 이름", type: string, required: true }
              - { name: en, label: "영문 이름", type: string }
          - name: role
            label: "과정"
            type: select
            required: true
            options:
              values:
                - { value: Postdoc, label: "박사후연구원" }
                - { value: PhD, label: "박사과정" }
                - { value: Integrated, label: "석박통합과정" }
                - { value: MS, label: "석사과정" }
                - { value: Intern, label: "학부연구생" }
                - { value: Staff, label: "연구원·행정" }
          - name: photo
            label: "사진"
            type: image
          - name: interests
            label: "관심 분야"
            type: string
          - name: email
            label: "이메일"
            type: string
          - name: links
            label: "링크 버튼 (LinkedIn, Google Scholar 등)"
            description: "종류를 고르고 주소를 넣으면 아이콘 버튼이 생깁니다."
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{fields.kind} · {fields.url}"
            fields:
              - name: kind
                label: "종류"
                type: select
                options:
                  values:
                    - { value: linkedin, label: "LinkedIn" }
                    - { value: scholar, label: "Google Scholar" }
                    - { value: github, label: "GitHub" }
                    - { value: homepage, label: "개인 홈페이지" }
                    - { value: cv, label: "CV" }
                    - { value: other, label: "기타" }
              - { name: url, label: "주소 (https://...)", type: string }
              - { name: label, label: "버튼 이름 (기타일 때만, 선택)", type: string }
      - name: alumni
        label: "졸업생"
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.degree} · {fields.name.ko}"
        fields:
          - name: name
            label: "이름"
            type: object
            fields:
              - { name: ko, label: "한글 이름", type: string, required: true }
              - { name: en, label: "영문 이름", type: string }
          - name: degree
            label: "학위·졸업연도"
            description: "예) M.S. 2025"
            type: string
          - name: photo
            label: "사진"
            type: image
          - name: now
            label: "현재 소속"
            type: string
          - { name: email, label: "이메일", type: string }
          - name: links
            label: "링크 버튼 (LinkedIn, Google Scholar 등)"
            description: "종류를 고르고 주소를 넣으면 아이콘 버튼이 생깁니다."
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{fields.kind} · {fields.url}"
            fields:
              - name: kind
                label: "종류"
                type: select
                options:
                  values:
                    - { value: linkedin, label: "LinkedIn" }
                    - { value: scholar, label: "Google Scholar" }
                    - { value: github, label: "GitHub" }
                    - { value: homepage, label: "개인 홈페이지" }
                    - { value: cv, label: "CV" }
                    - { value: other, label: "기타" }
              - { name: url, label: "주소 (https://...)", type: string }
              - { name: label, label: "버튼 이름 (기타일 때만, 선택)", type: string }
      - name: professor
        label: "지도교수"
        type: object
        fields:
          - name: name
            label: "이름"
            type: object
            fields:
              - { name: ko, label: "한글", type: string }
              - { name: en, label: "영문", type: string }
          - name: title
            label: "직위"
            type: object
            fields:
              - { name: ko, label: "한글", type: string }
              - { name: en, label: "영문", type: string }
          - { name: photo, label: "사진", type: image }
          - { name: email, label: "이메일", type: string }
          - name: links
            label: "버튼 링크 (Google Scholar, CV 등)"
            description: "주소가 비어 있으면 버튼이 숨겨집니다."
            type: object
            list: true
            fields:
              - { name: label, label: "버튼 이름", type: string }
              - { name: url, label: "주소", type: string }
          - { name: education, label: "학력", type: string, list: true }
          - { name: career, label: "경력", type: string, list: true }
          - { name: awards, label: "수상", type: string, list: true }
          - { name: service, label: "학술 활동", type: string, list: true }
          - { name: committee, label: "학위논문 심사 대학", type: string, list: true }

  # ------------------------------------------------------------ 갤러리 추가 사진
  - name: gallery
    label: "🖼️ 갤러리 추가 사진"
    description: "소식과 상관없는 사진(단체사진 등)만 여기에 추가하세요. 소식에 넣은 사진은 갤러리에 자동으로 나옵니다."
    type: file
    path: content/gallery.yml
    format: yaml
    fields:
      - name: photos
        label: "사진"
        type: object
        list:
          collapsible:
            collapsed: false
            summary: "{fields.date} · {fields.caption.ko}"
        fields:
          - { name: src, label: "사진", type: image, required: true }
          - name: caption
            label: "설명"
            type: object
            fields:
              - { name: ko, label: "한글", type: string }
              - { name: en, label: "영문", type: string }
          - { name: date, label: "날짜", type: string }

  # ------------------------------------------------------------ 기본 정보
  - name: site
    label: "⚙️ 연구실 소개 · 연구 분야 · 모집"
    type: file
    path: content/site.yml
    format: yaml
    fields:
      - name: lab
        label: "기본 정보"
        type: object
        fields:
          - { name: short, label: "약칭", type: string }
          - { name: name, label: "연구실 이름", type: string }
          - name: affiliation
            label: "소속"
            type: object
            fields:
              - { name: ko, label: "한글", type: string }
              - { name: en, label: "영문", type: string }
          - { name: email, label: "대표 이메일", type: string }
          - name: address
            label: "주소"
            type: object
            fields:
              - { name: ko, label: "한글", type: string }
              - { name: en, label: "영문", type: string }
      - name: hero
        label: "첫 화면 문구"
        type: object
        fields:
          - name: tagline
            label: "한 줄 소개"
            type: object
            fields:
              - { name: ko, label: "한글", type: text }
              - { name: en, label: "영문", type: text }
      - name: about
        label: "소개 (01 About)"
        type: object
        fields:
          - name: title
            label: "제목"
            type: object
            fields:
              - { name: ko, label: "한글", type: string }
              - { name: en, label: "영문", type: string }
          - name: body
            label: "본문"
            type: object
            fields:
              - { name: ko, label: "한글", type: text }
              - { name: en, label: "영문", type: text }
          - name: highlight
            label: "강조 문구 (빨간 글씨)"
            type: object
            fields:
              - { name: ko, label: "한글", type: text }
              - { name: en, label: "영문", type: text }
          - name: highlight_sub
            label: "강조 문구 아래 작은 글씨"
            type: object
            fields:
              - { name: ko, label: "한글", type: string }
              - { name: en, label: "영문", type: string }
      - name: research
        label: "연구 분야 (02 Research)"
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.title.ko}"
        fields:
          - name: title
            label: "분야 이름"
            type: object
            fields:
              - { name: ko, label: "한글", type: string }
              - { name: en, label: "영문", type: string }
          - name: body
            label: "설명"
            type: object
            fields:
              - { name: ko, label: "한글", type: text }
              - { name: en, label: "영문", type: text }
          - { name: tags, label: "키워드 태그", type: string, list: true }
      - name: join
        label: "모집 안내 (Join BARTS)"
        type: object
        fields:
          - name: title
            label: "제목"
            type: object
            fields:
              - { name: ko, label: "한글", type: string }
              - { name: en, label: "영문", type: string }
          - name: body
            label: "본문"
            type: object
            fields:
              - { name: ko, label: "한글", type: text }
              - { name: en, label: "영문", type: text }
          - name: positions
            label: "모집 분야"
            type: object
            list: true
            fields:
              - { name: ko, label: "한글", type: string }
              - { name: en, label: "영문", type: string }